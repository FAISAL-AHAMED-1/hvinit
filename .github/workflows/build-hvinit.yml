name: build-hvinit
on:
  workflow_dispatch:
  push:
    paths: ["hvinit.c", ".github/workflows/build-hvinit.yml"]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install arm64 cross compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build static hvinit
        run: |
          aarch64-linux-gnu-gcc -static -Os -Wall -o hvinit hvinit.c
          aarch64-linux-gnu-strip hvinit
          file hvinit || true
          ls -l hvinit
      - uses: actions/upload-artifact@v4
        with:
          name: hvinit
          path: hvinit
